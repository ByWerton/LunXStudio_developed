<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LunX Studio | Web Engine</title>
    <style>
        /* Tam ekran ayarları */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            background-color: #0c0c0c; 
            overflow: hidden; 
            touch-action: none;
        }
        #canvas { 
            display: block; 
            width: 100vw; height: 100vh; 
            background-color: #000;
            outline: none;
        }
        #ui-overlay {
            position: absolute; top: 15px; left: 15px;
            background: rgba(30, 30, 30, 0.9);
            padding: 10px 15px; border-radius: 8px;
            border: 1px solid #444; color: #fff;
            font-family: sans-serif; font-size: 13px;
            pointer-events: none; z-index: 10;
        }
        .dot {
            height: 8px; width: 8px;
            background-color: #ff4444;
            border-radius: 50%; display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <span id="dot" class="dot"></span>
        <span id="status">Motor Başlatılıyor... (main.js aranıyor)</span>
    </div>
    
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("contextmenu", function(e) { e.preventDefault(); }, false);
          return canvas;
        })(),
        onRuntimeInitialized: function() {
            document.getElementById('dot').style.backgroundColor = "#00ff00"; 
            document.getElementById('status').innerText = "LunX Studio | Aktif";
        }
      };

      window.addEventListener('resize', function() {
          if (Module.setCanvasSize) {
              Module.setCanvasSize(window.innerWidth, window.innerHeight);
          }
      });
    </script>
    
    <script async src="main.js"></script>
</body>
</html>
