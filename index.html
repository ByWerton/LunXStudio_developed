<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>C++ WebAssembly Oyunum</title>
    <style>
        body { background-color: #222; color: white; text-align: center; }
        canvas { border: 2px solid #555; background-color: black; }
    </style>
</head>
<body>
    <h1>C++ WebAssembly Çıktısı</h1>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <script type='text/javascript'>
      var Module = {
        canvas: (function() {
          return document.getElementById('canvas');
        })()
      };
    </script>
    <script async src="index.js"></script>
</body>
</html>
